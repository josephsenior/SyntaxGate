name: Bug report
description: Report a reproducible problem with SyntaxGate
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please provide enough detail for us to reproduce the issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: Include a command, file snippet, or small repository when possible.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SyntaxGate version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python 3.12 on Ubuntu 24.04
    validations:
      required: true
